name: Release CI

# The 3-OS matrix (check, clippy, tests, build, artifacts) is expensive:
# it runs only when we intend to release — a version tag or a manual run —
# not on every push to main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: modelfolio-windows-x64.exe
            binary: target/release/modelfolio.exe
          - os: macos-latest
            name: macos
            artifact: modelfolio-macos
            binary: target/release/modelfolio
          - os: ubuntu-latest
            name: linux
            artifact: modelfolio-linux
            binary: target/release/modelfolio
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
